<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Console</title>
<style>
  :root {
    --bg:#0f1216; --panel:#161b22; --edge:#232a33; --ink:#e6edf3; --dim:#8b98a5;
    --accent:#7cc4ff; --ok:#3fb950; --warn:#d29922; --bad:#f85149; --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f6f8fa; --panel:#fff; --edge:#d8dee4; --ink:#1f2328; --dim:#636c76; --accent:#0969da; }
  }
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
  header{display:flex;gap:16px;align-items:baseline;padding:14px 20px;border-bottom:1px solid var(--edge)}
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px}
  header .sub{color:var(--dim);font-size:12px}
  nav{margin-left:auto;display:flex;gap:4px}
  nav button{background:none;border:1px solid transparent;color:var(--dim);padding:5px 11px;
    border-radius:6px;cursor:pointer;font-size:13px}
  nav button[aria-selected=true]{background:var(--panel);border-color:var(--edge);color:var(--ink)}
  main{padding:18px 20px;max-width:1180px}
  .row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
  input,select{background:var(--panel);border:1px solid var(--edge);color:var(--ink);
    border-radius:6px;padding:6px 9px;font-size:13px;font-family:inherit}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--dim);font-weight:500;font-size:11px;text-transform:uppercase;
    letter-spacing:.06em;padding:7px 10px;border-bottom:1px solid var(--edge)}
  td{padding:7px 10px;border-bottom:1px solid var(--edge);vertical-align:top}
  tbody tr:hover{background:var(--panel);cursor:pointer}
  .pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:500}
  .completed{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
  .failed,.dead_letter{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
  .waiting{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
  .running,.queued{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
  .mono{font-family:var(--mono);font-size:12px}
  .dim{color:var(--dim)}
  .card{background:var(--panel);border:1px solid var(--edge);border-radius:9px;padding:14px;margin-bottom:12px}
  .card h2{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:600}
  .bar{display:flex;height:22px;border-radius:5px;overflow:hidden;background:var(--edge);margin:8px 0}
  .bar>span{display:flex;align-items:center;justify-content:center;font-size:10px;color:#0f1216;font-weight:600;min-width:0}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--dim)}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .stat{background:var(--panel);border:1px solid var(--edge);border-radius:9px;padding:11px 13px}
  .stat b{display:block;font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}
  .stat span{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
  pre{background:var(--bg);border:1px solid var(--edge);border-radius:6px;padding:10px;
    overflow:auto;font-family:var(--mono);font-size:11.5px;margin:0;max-height:280px}
  .empty{color:var(--dim);padding:22px;text-align:center}
  .err{color:var(--bad);font-size:12px;margin-left:auto}
  button.go{background:var(--accent);border:none;color:#04131f;border-radius:6px;padding:7px 13px;
    font-weight:600;cursor:pointer;align-self:end}
</style>
</head>
<body>
<header>
  <h1>Agent Console</h1>
  <span class="sub">self-hosted &mdash; no telemetry leaves this deployment (§16.1)</span>
  <nav>
    <button data-tab="runs" aria-selected="true">Runs</button>
    <button data-tab="analytics" aria-selected="false">Analytics</button>
    <button data-tab="ops" aria-selected="false">Ops</button>
  </nav>
  <span class="err" id="err"></span>
</header>
<main>
  <div class="row">
    <div class="field"><label for="ns">Namespace</label><input id="ns" value="demo"></div>
    <div class="field"><label for="tenant">Tenant</label><input id="tenant" value="merchant-1"></div>
    <div class="field"><label for="subject">Caller</label><input id="subject" value="svc:demo-client"></div>
    <button class="go" id="reload">Reload</button>
  </div>
  <div id="view"></div>
</main>
<script type="module">
const $ = (s) => document.querySelector(s);
const el = (t, a = {}, ...kids) => {
  const n = document.createElement(t);
  for (const [k, v] of Object.entries(a)) {
    if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v; else n.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null) n.append(kid);
  return n;
};
const headers = () => ({
  'content-type': 'application/json',
  'x-caller-subject': $('#subject').value,
  'x-namespace': $('#ns').value,
  'x-tenant-ref': $('#tenant').value,
});
async function api(path) {
  const res = await fetch(path, { headers: headers() });
  if (!res.ok) throw new Error(`${res.status} ${path}`);
  return res.json();
}
const ms = (v) => (v == null ? '—' : v >= 1000 ? `${(v / 1000).toFixed(2)}s` : `${Math.round(v)}ms`);
const money = (micros) => `$${(micros / 1e6).toFixed(6)}`;
let tab = 'runs';

async function render() {
  $('#err').textContent = '';
  try { await views[tab](); }
  catch (e) { $('#err').textContent = e.message; }
}

const views = {
  async runs() {
    const { threads } = await api('/v1/threads');
    const rows = [];
    for (const t of threads.slice(0, 12)) {
      const { runs } = await api(`/v1/threads/${t.id}/runs`);
      for (const r of runs) rows.push({ ...r, thread: t.id, title: t.title });
    }
    rows.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

    const table = el('table', {},
      el('thead', {}, el('tr', {},
        ...['Run', 'Thread', 'Status', 'Steps', 'Cost', 'When'].map((h) => el('th', { text: h })))),
      el('tbody', {}, rows.slice(0, 60).map((r) =>
        el('tr', { 'data-run': r.id },
          el('td', { class: 'mono', text: r.id.slice(0, 8) }),
          el('td', { class: 'dim', text: r.title || r.thread.slice(0, 8) }),
          el('td', {}, el('span', { class: `pill ${r.status}`, text: r.status })),
          el('td', { text: String(r.step_count) }),
          el('td', { class: 'mono', text: money(Number(r.cost_micros)) }),
          el('td', { class: 'dim', text: new Date(r.created_at).toLocaleTimeString() })))));

    table.addEventListener('click', (e) => {
      const id = e.target.closest('tr')?.dataset.run;
      if (id) showTrace(id);
    });
    $('#view').replaceChildren(rows.length ? table : el('div', { class: 'empty', text: 'No runs yet.' }),
      el('div', { id: 'trace' }));
  },

  async analytics() {
    const [versions, latency, tools, memory, feedback] = await Promise.all([
      api('/v1/analytics/versions?hours=168'), api('/v1/analytics/latency?hours=168'),
      api('/v1/analytics/tools?hours=168'), api('/v1/analytics/memory?hours=168'),
      api('/v1/feedback/summary?hours=168'),
    ]);
    const totals = versions.versions.reduce((a, v) => ({
      runs: a.runs + v.runs, ok: a.ok + v.completed, cost: a.cost + v.costMicros }), { runs: 0, ok: 0, cost: 0 });

    $('#view').replaceChildren(
      el('div', { class: 'grid' },
        stat('Runs (7d)', totals.runs),
        stat('Success', totals.runs ? `${Math.round((totals.ok / totals.runs) * 100)}%` : '—'),
        stat('Spend', money(totals.cost)),
        stat('Queue p95', ms(latency.queueWaitMs.p95))),
      card('By agent version — is the new one better?', versionTable(versions.versions)),
      card('Where the time goes', latencyPanel(latency)),
      card('Tool health', toolTable(tools.tools)),
      card('Memory effectiveness', memoryPanel(memory)),
      card('Feedback', feedbackTable(feedback.summary)));
  },

  async ops() {
    const [subsystems, dead] = await Promise.all([
      fetch('/v1/ops/subsystems').then((r) => r.json()),
      api('/v1/ops/dead-letters'),
    ]);
    $('#view').replaceChildren(
      card('Subsystems', el('pre', { text: JSON.stringify(subsystems, null, 2) })),
      card(`Dead letters (${dead.deadLetters.length} open)`, dead.deadLetters.length
        ? el('table', {},
            el('thead', {}, el('tr', {}, ...['Run', 'Reason', 'Attempts', 'Worker', 'When']
              .map((h) => el('th', { text: h })))),
            el('tbody', {}, dead.deadLetters.map((d) => el('tr', {},
              el('td', { class: 'mono', text: d.run_id.slice(0, 8) }),
              el('td', { text: d.reason }),
              el('td', { text: String(d.attempts) }),
              el('td', { class: 'dim mono', text: d.last_worker ?? '—' }),
              el('td', { class: 'dim', text: new Date(d.created_at).toLocaleString() })))))
        : el('div', { class: 'empty', text: 'Nothing dead-lettered.' })));
  },
};

const stat = (label, value) => el('div', { class: 'stat' },
  el('b', { text: String(value) }), el('span', { text: label }));
const card = (title, body) => el('div', { class: 'card' }, el('h2', { text: title }), body);

function versionTable(rows) {
  if (!rows.length) return el('div', { class: 'empty', text: 'No runs in this window.' });
  return el('table', {},
    el('thead', {}, el('tr', {}, ...['Agent', 'Ver', 'Runs', 'Success', 'p50', 'p95', 'Memory', 'Cost']
      .map((h) => el('th', { text: h })))),
    el('tbody', {}, rows.map((v) => el('tr', {},
      el('td', { text: v.agent ?? 'ephemeral' }),
      el('td', { class: 'mono', text: v.version == null ? '—' : `v${v.version}` }),
      el('td', { text: String(v.runs) }),
      el('td', { text: v.successRate == null ? '—' : `${Math.round(v.successRate * 100)}%` }),
      el('td', { class: 'mono', text: ms(v.latencyMs.p50) }),
      el('td', { class: 'mono', text: ms(v.latencyMs.p95) }),
      el('td', { class: 'dim', text: v.memoryEnabled ? 'on' : 'off' }),
      el('td', { class: 'mono', text: money(v.costMicros) })))));
}

function latencyPanel(l) {
  const parts = [
    ['queue', l.queueWaitMs.p50 ?? 0, 'var(--warn)'],
    ...l.steps.map((s) => [s.kind.replace('_call', ''), s.p50Ms ?? 0,
      s.kind === 'model_call' ? 'var(--accent)' : 'var(--ok)']),
  ].filter(([, v]) => v > 0);
  const total = parts.reduce((a, [, v]) => a + v, 0) || 1;
  return el('div', {},
    el('div', { class: 'bar' }, parts.map(([name, v, colour]) =>
      el('span', { style: `flex:${v};background:${colour}`, text: v / total > 0.12 ? name : '' }))),
    el('div', { class: 'legend' }, parts.map(([name, v, colour]) =>
      el('span', {}, el('i', { style: `background:${colour}` }), `${name} ${ms(v)}`))),
    el('p', { class: 'dim', style: 'margin:9px 0 0;font-size:12px',
      text: 'Queue wait is separate from work: "the agent is slow" and "the queue is deep" have different fixes.' }));
}

function toolTable(rows) {
  if (!rows.length) return el('div', { class: 'empty', text: 'No tool calls yet.' });
  return el('table', {},
    el('thead', {}, el('tr', {}, ...['Tool', 'Origin', 'Calls', 'Failures', 'p95', 'Gated']
      .map((h) => el('th', { text: h })))),
    el('tbody', {}, rows.map((t) => el('tr', {},
      el('td', { class: 'mono', text: t.tool }),
      el('td', { class: 'dim', text: t.origin }),
      el('td', { text: String(t.calls) }),
      el('td', { class: t.failureRate > 0 ? 'err' : '', text: `${Math.round(t.failureRate * 100)}%` }),
      el('td', { class: 'mono', text: ms(t.p95Ms) }),
      el('td', { class: 'dim', text: String(t.approvalGated) })))));
}

function memoryPanel(m) {
  return el('div', {},
    el('table', {},
      el('thead', {}, el('tr', {}, ...['Memory', 'Runs', 'Success', 'Avg steps', 'p95', 'Rating']
        .map((h) => el('th', { text: h })))),
      el('tbody', {}, m.cohorts.map((c) => el('tr', {},
        el('td', { text: c.memoryEnabled ? 'enabled' : 'disabled' }),
        el('td', { text: String(c.runs) }),
        el('td', { text: c.successRate == null ? '—' : `${Math.round(c.successRate * 100)}%` }),
        el('td', { text: c.avgSteps == null ? '—' : c.avgSteps.toFixed(1) }),
        el('td', { class: 'mono', text: ms(c.p95Ms) }),
        el('td', { text: c.avgRating == null ? '—' : c.avgRating.toFixed(2) }))))),
    el('p', { class: 'dim', style: 'margin:9px 0 0;font-size:12px', text: m.caveat }));
}

function feedbackTable(rows) {
  if (!rows.length) return el('div', { class: 'empty', text: 'No feedback yet.' });
  return el('table', {},
    el('thead', {}, el('tr', {}, ...['Agent', 'Ver', 'Total', 'Avg', 'Negative', 'Corrections']
      .map((h) => el('th', { text: h })))),
    el('tbody', {}, rows.map((f) => el('tr', {},
      el('td', { text: f.agent ?? 'ephemeral' }),
      el('td', { class: 'mono', text: f.version == null ? '—' : `v${f.version}` }),
      el('td', { text: String(f.total) }),
      el('td', { text: f.avgRating == null ? '—' : f.avgRating.toFixed(2) }),
      el('td', { text: String(f.negative) }),
      el('td', { text: String(f.corrections) })))));
}

async function showTrace(runId) {
  const t = await api(`/v1/runs/${runId}/trace`);
  const l = t.latency;
  const parts = [['queue', l.queueWaitMs ?? 0, 'var(--warn)'], ['model', l.modelMs, 'var(--accent)'],
    ['tool', l.toolMs, 'var(--ok)'], ['human', l.humanWaitMs, 'var(--bad)'],
    ['other', l.unaccountedMs ?? 0, 'var(--edge)']].filter(([, v]) => v > 0);
  const total = parts.reduce((a, [, v]) => a + v, 0) || 1;

  const steps = el('table', {},
    el('thead', {}, el('tr', {}, ...['#', 'Kind', 'Status', 'Latency', 'Detail'].map((h) => el('th', { text: h })))),
    el('tbody', {}, t.steps.map((s) => el('tr', {},
      el('td', { text: String(s.seq) }),
      el('td', { text: s.kind }),
      el('td', {}, el('span', { class: `pill ${s.status === 'succeeded' ? 'completed' : s.status}`, text: s.status })),
      el('td', { class: 'mono', text: ms(s.latencyMs) }),
      el('td', { class: 'mono dim', text: JSON.stringify(s.detail).slice(0, 90) })))));

  document.querySelector('#trace').replaceChildren(card(`Run ${runId.slice(0, 8)} — ${t.status}`,
    el('div', {},
      el('div', { class: 'bar' }, parts.map(([n, v, c]) =>
        el('span', { style: `flex:${v};background:${c}`, text: v / total > 0.12 ? n : '' }))),
      el('div', { class: 'legend' }, parts.map(([n, v, c]) =>
        el('span', {}, el('i', { style: `background:${c}` }), `${n} ${ms(v)}`))),
      steps,
      t.children.length ? el('p', { class: 'dim', style: 'margin-top:9px',
        text: `${t.children.length} delegated child run(s)` }) : null)));
  document.querySelector('#trace').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

document.querySelectorAll('nav button').forEach((b) => b.addEventListener('click', () => {
  document.querySelectorAll('nav button').forEach((x) => x.setAttribute('aria-selected', String(x === b)));
  tab = b.dataset.tab; render();
}));
$('#reload').addEventListener('click', render);
render();
</script>
</body>
</html>

# =====================================================================
# hpoc — local Postgres tuning
#
# Mounted at /etc/postgresql/postgresql.conf and loaded with
# `-c config_file=`, so this file must be self-sufficient: anything the
# image's default postgresql.conf would have set has to be set here too.
#
# Dev-box values. Not a production baseline.
# =====================================================================

listen_addresses = '*'

# ---------------------------------------------------------------------
# Preloaded libraries
#
# timescaledb          time series (hypertables, continuous aggregates)
# pg_stat_statements   query fingerprint stats           (observability)
# pg_stat_kcache       real CPU + fs I/O per query       (observability)
# pg_wait_sampling     sampled wait events per query id  (observability)
# auto_explain         plans for slow queries            (observability)
# pg_cron              scheduled jobs / matview refresh  (caching)
# pg_prewarm           buffer cache preload + autoprewarm(caching)
#
# Order matters twice over: timescaledb patches the planner and expects to
# load before anything else that hooks it, and pg_stat_kcache reads
# pg_stat_statements' shared state so it must load after it.
# ---------------------------------------------------------------------
shared_preload_libraries = 'timescaledb,pg_stat_statements,pg_stat_kcache,pg_wait_sampling,auto_explain,pg_cron,pg_prewarm'

# ---------------------------------------------------------------------
# Resources (sized for a laptop container, not a server)
# ---------------------------------------------------------------------
max_connections = 200
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 16MB
maintenance_work_mem = 256MB
wal_buffers = 16MB
min_wal_size = 128MB
max_wal_size = 2GB
random_page_cost = 1.1              # SSD
effective_io_concurrency = 200

# ---------------------------------------------------------------------
# Observability
#
# track_io_timing and compute_query_id are what make pg_stat_statements
# worth reading — without them you get counts but no I/O attribution and
# no way to join a plan back to a fingerprint.
# ---------------------------------------------------------------------
track_io_timing = on
track_functions = 'pl'
track_activity_query_size = 4096
compute_query_id = on

pg_stat_statements.max = 10000
pg_stat_statements.track = all
pg_stat_statements.track_utility = on
pg_stat_statements.save = on

pg_stat_kcache.linux_hz = 1000

pg_wait_sampling.profile_period = 10        # ms between wait-event samples
pg_wait_sampling.profile_pid = on
pg_wait_sampling.profile_queries = on

auto_explain.log_min_duration = '250ms'
auto_explain.log_analyze = on
auto_explain.log_buffers = on
auto_explain.log_verbose = on
auto_explain.log_nested_statements = on
auto_explain.log_triggers = on
auto_explain.log_format = 'json'
auto_explain.log_timing = off       # per-node timing is expensive; buffers carry most of the signal
auto_explain.sample_rate = 1.0      # dev box: explain everything over the threshold

# ---------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------
logging_collector = off             # container: log to stderr, let docker capture it
log_destination = 'stderr'
log_min_duration_statement = '500ms'
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0
log_line_prefix = '%m [%p] %q%u@%d/%a '
log_timezone = 'UTC'
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'

# ---------------------------------------------------------------------
# Caching helpers
#
# autoprewarm dumps the buffer cache contents on shutdown and reloads
# them on start, so a restarted container is not cold.
# ---------------------------------------------------------------------
pg_prewarm.autoprewarm = on
pg_prewarm.autoprewarm_interval = '300s'

cron.database_name = 'hpoc'
cron.use_background_workers = on
max_worker_processes = 32           # timescaledb workers + pg_cron + parallel workers

# ---------------------------------------------------------------------
# TimescaleDB
# ---------------------------------------------------------------------
timescaledb.telemetry_level = 'off'
timescaledb.max_background_workers = 8
